# Generated by `ergane init --wire`: one job per gate declared in ergane.yaml.
#
# The job names below ARE the gate names. GitHub names each check run after the
# job's `name`, and the merge queue requires a check named after each declared
# gate — rename a job here and the factory refuses to dispatch against this repo.
#
# `scripts/gate.sh` is stdlib-Python and shell on purpose: Ergane runs the same
# command inside a bwrap worktree with no network, where nothing can be
# installed. So there is no toolchain setup step here either — ubuntu-latest
# already ships the python3 the gate uses.
name: ergane gates

on:
  pull_request:
  merge_group:

jobs:
  test:
    name: "test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "test"
        run: bash scripts/gate.sh
