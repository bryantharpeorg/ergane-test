<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip detail</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="container">
    <a href="/" class="back-link">← All trips</a>

    <section class="trip-header" id="trip-header">
      <h1 id="trip-name"></h1>
      <p class="trip-meta" id="trip-meta"></p>
      <p class="trip-total">Total: <span id="trip-total"></span></p>
    </section>

    <section class="subtotals-section" id="subtotals-block">
      <h2>Spending by category</h2>
      <div id="subtotals-list"></div>
    </section>

    <section class="chart-section" id="chart-block">
      <h2>Chart</h2>
      <div id="chart-container"></div>
    </section>

    <section class="form-section">
      <h2>Add expense</h2>
      <form id="add-expense-form">
        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date" name="date" required>
          <span class="error" id="error-date"></span>
        </div>
        <div class="field">
          <label for="amount">Amount</label>
          <input type="text" id="amount" name="amount" placeholder="0.00" required>
          <span class="error" id="error-amount"></span>
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="" disabled selected>Choose a category</option>
            <option value="Lodging">Lodging</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Gear">Gear</option>
            <option value="Fees">Fees</option>
            <option value="Other">Other</option>
          </select>
          <span class="error" id="error-category"></span>
        </div>
        <div class="field field-wide">
          <label for="note">Note</label>
          <input type="text" id="note" name="note" maxlength="280">
          <span class="error" id="error-note"></span>
        </div>
        <button type="submit">Add expense</button>
      </form>
    </section>

    <section class="filter-section" id="filter-block">
      <h2>Filter expenses</h2>
      <div id="category-filter"></div>
    </section>

    <section class="list-section">
      <h2>Expenses</h2>
      <div id="empty-state" class="empty-state" hidden>
        No expenses yet. Add one above.
      </div>
      <table id="expenses-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Category</th>
            <th class="numeric">Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="expenses-body">
        </tbody>
      </table>
    </section>

    <section class="export-section" id="export-block">
      <h2>Export</h2>
      <button id="export-btn">Download CSV</button>
    </section>

    <section class="import-section" id="import-block">
      <h2>Import</h2>
      <div id="import-form"></div>
    </section>
  </main>

  <script src="/static/trip-detail.js"></script>
</body>
</html>
